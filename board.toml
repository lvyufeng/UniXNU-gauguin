# Board description of the Xiaomi Redmi Note 9 Pro 5G / Mi 10T Lite (gauguin,
# SM7125 lagoon, Adreno 610), read by the unixnu build driver.
#
# Values marked MEASURED were read from the phone itself; the rest are copied
# from the closest published port and must be confirmed on hardware.

[board]
name = "gauguin"
soc = "SM7125"
description = "Xiaomi Redmi Note 9 Pro 5G / Mi 10T Lite"
kit = "gauguin"

# The userland this device runs today is the iPhone X restore image, the same
# target the ios-sweet port on this phone used.
[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
chip_id = 0x8015
board_id = 0x0b   # 10H392 (iPhone10,6) shares board 0x0b; the identity is chosen by device_class
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# MEASURED on the phone (GPT entry "userdata", LUN 0, 4096-byte logical blocks):
#   first = 2887680 (0x2c1000), last = 30944250 (0x1d82bfa), capacity 114919714816.
[userdata]
first_lba = 0x2c1000
last_lba = 0x1d82bfa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "gauguin_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff0056fb000"
roots = [
"com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
config = "gauguin"
dsc = "Platforms/Xiaomi/gauguinPkg/gauguin.dsc"
fd = "Build/gauguinPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
]

[firmware.defines]
DEVICE_MODEL = "gauguin"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "gauguin-research"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 1

[payload]
volume = "UNIXNU-GAU"
size_mib = 192
loader = "firmware"
title = "UniXNU gauguin"
dram_size = "0x80000000"
panic_screen = true
timeout = 3
kernel_args = ["-v", "serial=3", "cpus=8"]

[payload.adt]
tool = "scripts/make-gauguin-adt.py"
# The UEFI-visible window from the device DT: memory@80000000 is 0x3bb00000.
dram_size = "0x3bb00000"
# Software identity seed, not an Apple silicon ID: XNU publishes
# IOPlatformUUID from it and gethostuuid() callers block without it.
# Passed as --unique-chip-id; the driver does not forward it from this table.
chip_id = "0x47554749"
owned_memory_size = "0x10000000"
# SM7125 core numbering in the compiled board DT: one Affinity1 value per core.
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"
packed_data_ramdisk = true
ipad_identity = false
